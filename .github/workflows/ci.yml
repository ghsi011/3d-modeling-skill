name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the light stack. The editable install pulls core runtime deps plus
      # the MCP extra for tools/mcp_server.py smoke coverage. cadquery / OCP /
      # pyrender / scipy / shapely are heavy optional extras and are deliberately
      # NOT installed here -- this job is also what proves the tooling degrades
      # honestly on a core-only install. The `section` job below covers the
      # cross-section path that skips here.
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff pytest PyYAML -e ".[mcp]"

      - name: Ruff (lint)
        run: ruff check skills tools

      # Before Pytest, deliberately. Any test that shells out to the generator
      # writes into the working tree, which would repair the drift this step
      # exists to catch and make it pass unconditionally.
      - name: Generated harness is current
        run: python tools/gen_harness.py --check

      - name: Pytest
        run: pytest

      - name: Internal markdown links
        run: python tools/check_internal_links.py

      - name: Build skill bundles
        run: python tools/build_skill.py --out dist/skills

  # The cross-section path (designer_toolkit.metrics.datum_features and the
  # datum blocks bundle.finalize derives from it) skips on the lean stack above.
  # It is deterministic mesh work with no GL context needed, so it gets its own
  # job with the `section` extra installed rather than going untested.
  section:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest -e ".[section]"

      - name: Pytest (cross-section path)
        run: pytest skills/3d-modeling/scripts/designer_toolkit
