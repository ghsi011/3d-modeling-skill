name: CI

# ROADMAP.md section 5.1 says L0 runs on every commit and L1 on pull requests.
# `push:` with no branch filter is what "every commit" means for a workflow: a
# filter of `[main]` gates only what has already been merged, which is after the
# only moment the gate could have stopped anything.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install all dependencies (core + extras + dev)
        run: uv sync --frozen --all-extras

      - name: Ruff (lint)
        run: uv run ruff check skills tools benchmarks

      # Before Pytest, deliberately. Any test that shells out to the generator
      # writes into the working tree, which would repair the drift this step
      # exists to catch and make it pass unconditionally.
      - name: Generated and stale-file scan
        run: uv run python tools/gen_harness.py --check

      # L0, the commit gate. `testpaths` in pyproject.toml is
      # `skills/3d-modeling/scripts` and `tools`, so this collects the unit suite
      # and the harness guards and collects neither `benchmarks/heavy` nor
      # `benchmarks/replays`. ROADMAP.md section 4.4 budgets the ladders
      # separately and no number means anything if one suite can run inside
      # another.
      #
      # The timeout is the budget, made enforceable. Section 4.4 budgets this
      # suite at about a minute and it measures 47 s on the reference machine;
      # three minutes is the room a shared runner needs and still an order below
      # the 997 s this gate used to cost. A wall clock nobody bounds is how it
      # got there.
      - name: Pytest (L0 — the commit gate)
        timeout-minutes: 3
        run: uv run pytest

      - name: Internal markdown links
        run: uv run python tools/check_internal_links.py

      - name: Build skill bundles
        run: uv run python tools/build_skill.py --out dist/skills

      - name: Build production wheel
        run: uv build --wheel --out-dir dist/wheels

  # Everything that runs before a merge and cannot run on every commit. Two
  # suites, one job, one trigger: ROADMAP.md section 5.1 puts L1 on pull requests
  # and before merge, and the heavy half of L0 was cut out of the commit gate for
  # a cost reason, not a coverage one, so it belongs on the same trigger rather
  # than on none. A tier nobody runs is worse than no tier: it reports all clear.
  #
  # Its own job rather than steps in `test`, for two reasons. One Python version
  # is enough: a replay compares a run against a recording of the same pipeline,
  # so running it twice measures the interpreter and not the job. And a separate
  # job keeps the wall clock of the L0 gate readable, which is the number section
  # 4.4 actually budgets.
  pre-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The heavy tier is the only place the Linux confinement is exercised, and
    # on a bare hosted runner it could not be exercised at all: the job runs as
    # uid 1001 with no `CAP_SYS_ADMIN`, so every confinement-dependent case
    # failed with the boundary refusing to construct itself -- 81 of them. A
    # tier that cannot run the thing it is for is a tier that reports on
    # nothing, so the job is given exactly the authority the boundary needs and
    # no more.
    #
    # `--cap-add=SYS_ADMIN` plus one AppArmor opt-out, and nothing else. Not
    # `--privileged`, which would hand over every capability and device access
    # to a job whose whole subject is a candidate that must not have them.
    #
    # The AppArmor line is measured, not guessed. The first hosted run with only
    # `--cap-add=SYS_ADMIN` got the capability -- the preflight printed
    # `CapEff=0x00000000a82425fb`, `CAP_SYS_ADMIN (bit 21): effective=True`, and
    # `describe_confinement.available = True` -- and then the real confined child
    # still failed to build the namespace:
    #
    #     mount(None -> /, 0x44000): [Errno 13] Permission denied
    #
    # `0x44000` is `MS_REC|MS_PRIVATE`, the step that detaches the mount tree
    # before anything is made read-only. Errno 13 is `EACCES`, and which errno
    # it is decides which mechanism refused. Docker's default seccomp profile
    # permits `mount` once `CAP_SYS_ADMIN` is in the capability set and answers
    # `EPERM` when it does refuse; the `docker-default` AppArmor profile denies
    # mount outright and answers `EACCES`. So seccomp is not what is blocking
    # this, and `seccomp=unconfined` would have been the wrong knob turned on a
    # hunch -- the syscall filter stays fully in place and is deliberately not
    # relaxed here.
    #
    # If a later run shows a syscall refused with `EPERM` while the capability
    # is effective, that is the evidence that would justify looking at seccomp,
    # and the narrowest form of it. Nothing about this configuration is allowed
    # to be inferred; the preflight prints the masks every run so the next
    # change can be argued from an errno.
    #
    # The image is pinned by digest rather than by tag, because a tag is a
    # moving target and this job's result is evidence. `ghcr.io/astral-sh/uv`
    # was chosen for three reasons: it carries Python 3.12.12 and uv already, so
    # the toolchain the gate measures is the toolchain the image ships; it is
    # Debian bookworm and glibc-based, which `actions/checkout` and the runner's
    # mounted node need; and it descends from the official Python image, so
    # `git` is present and checkout does not fall back to a tarball. GHCR also
    # avoids the anonymous pull-rate limit that makes Docker Hub a flaky
    # dependency in CI.
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:85d4cb1afa769a7338e095b927bee941cf5ec92266c7424b3f6c0f2748567248
      options: --cap-add=SYS_ADMIN --security-opt apparmor=unconfined

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `ubuntu-latest` carries these; a Python base image does not, and the CAD
      # kernel is a compiled extension that links against them. `OCP` (and so
      # `build123d`, and so every `trim_ring` build, the screening corpus and the
      # STEP reads) fails at *import* with `libGL.so.1: cannot open shared object
      # file` without them -- 15 of the 16 failures on the first containerised
      # run were that one missing library, arriving as `ImportError` in tests
      # that have nothing to do with graphics.
      #
      # Runtime libraries only, no recommends: this is making the image match
      # what the hosted runner already had, not adding capability to the job.
      - name: System libraries the CAD kernel links against
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxext6 libx11-6 libxi6 libxrender1 \
            libsm6 libice6 libglib2.0-0 libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install all dependencies (core + extras + dev)
        run: uv sync --frozen --all-extras

      # Before pytest, and it fails the job rather than skipping anything. The
      # failure this exists to prevent is the quiet one: `unittest.skipIf` on an
      # unavailable boundary turns a runner that cannot confine into a green
      # tick, and the confinement tests are exactly the ones nobody would notice
      # missing. So the capability is asserted here, in the open, with the masks
      # printed -- and then a real confined child is built, because `available`
      # is a probe's opinion until something has actually run behind it.
      - name: Preflight (the boundary is real, or this job stops)
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "skills/3d-modeling/scripts")
          from pipeline import confine
          from pipeline import confine_posix as CP

          effective, permitted = CP._capability_sets()
          print(f"uid={os.getuid()} euid={os.geteuid()}")
          print(f"CapEff=0x{effective:016x}")
          print(f"CapPrm=0x{permitted:016x}")
          print(f"CAP_SYS_ADMIN (bit {CP.CAP_SYS_ADMIN}): "
                f"effective={bool(effective >> CP.CAP_SYS_ADMIN & 1)} "
                f"permitted={bool(permitted >> CP.CAP_SYS_ADMIN & 1)}")
          for key, value in CP.describe_confinement().items():
              print(f"describe_confinement.{key} = {value!r}")

          reason = CP.unavailable_reason()
          if reason is not None:
              print(f"::error::the Linux boundary is unavailable on this runner: {reason}")
              raise SystemExit(1)

          with tempfile.TemporaryDirectory() as raw:
              root = Path(raw)
              build = root / "build"
              build.mkdir()
              canary = root / "canary.py"
              canary.write_text(
                  "import sys\n"
                  "from pathlib import Path\n"
                  "Path(sys.argv[1], 'built').write_text('ok')\n",
                  encoding="utf-8")
              confine.seal_read_only(canary)
              confine.seal_writable(build)
              result = confine.run([sys.executable, str(canary), str(build)],
                                   cwd=build, env={"PATH": "/usr/bin:/bin"},
                                   timeout=120)
              built = (build / "built").is_file()
              confine.unseal(root)

          print(f"confined child: returncode={result.returncode} "
                f"timed_out={result.timed_out} survivors={result.survivors} "
                f"wrote_its_output={built}")
          if result.returncode != 0 or result.timed_out or not built:
              print("::error::the namespace was not constructed: a confined child "
                    "could not run to completion and write its output")
              raise SystemExit(1)
          print("preflight: the boundary constructs and a candidate runs inside it")
          PY

      # L0-heavy — the component fixtures that start a child interpreter: the
      # two command surfaces, the confined build boundary, the packaging and
      # bundle smokes, the screening corpus. Same tests as before the split,
      # moved rather than weakened; benchmarks/heavy/README.md carries the
      # profile that decided the seam. Before the replays, because it is the
      # cheaper of the two and a broken command surface fails a replay in a way
      # that is much harder to read.
      - name: Pytest (L0-heavy — component fixtures that cost a process)
        run: uv run pytest benchmarks/heavy -q

      # A case whose supplied artifact is an `ExternalFile` this runner does not
      # have skips, exactly as the L0 fixture set does. `custom-knob-sleeve` and
      # `branch-knob-seat-fallback` need nothing outside the repository, and the
      # two `modify-ball-*` cases share a vendored source, so all four run on a
      # bare checkout -- and a suite that skipped everything here would be a gate
      # that does not gate.
      - name: Pytest (L1 — recorded job replays)
        run: uv run pytest benchmarks/replays -q
