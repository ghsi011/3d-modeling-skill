name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the light stack. The test suites import trimesh + numpy (+ stdlib);
      # pillow rounds out the core runtime deps and manifold3d is the boolean
      # engine designer_toolkit's fit/coupon tests need (a light pure wheel).
      # cadquery / OCP / pyrender / scipy / shapely are heavy optional extras and
      # are deliberately NOT installed here.
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff pytest PyYAML trimesh numpy pillow manifold3d

      - name: Ruff (lint)
        run: ruff check skills/3d-modeling/scripts

      - name: Pytest
        run: pytest

      - name: Generated harness is current
        run: python tools/gen_harness.py --check
