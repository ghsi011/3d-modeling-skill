name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the light stack. The editable install pulls core runtime deps plus
      # the MCP extra for tools/mcp_server.py smoke coverage. cadquery / OCP /
      # pyrender / scipy / shapely are heavy optional extras and are deliberately
      # NOT installed here.
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff pytest PyYAML -e ".[mcp]"

      - name: Ruff (lint)
        run: ruff check skills/3d-modeling/scripts

      - name: Pytest
        run: pytest

      - name: Generated harness is current
        run: python tools/gen_harness.py --check

      - name: Internal markdown links
        run: python tools/check_internal_links.py
