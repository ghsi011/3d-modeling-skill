name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the light stack. The three test suites
      # (test_team_preflight, test_mesh_io, team_tools/test_contracts)
      # import only trimesh + numpy (+ stdlib); pillow rounds out the core
      # runtime deps. cadquery / OCP / pyrender / scipy / shapely are heavy
      # optional extras and are deliberately NOT installed here.
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff pytest trimesh numpy pillow

      - name: Ruff (lint)
        run: ruff check skills/3d-modeling/scripts

      - name: Pytest
        run: pytest
