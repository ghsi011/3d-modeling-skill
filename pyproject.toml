[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-modeling-skill"
version = "0.1.0"
description = "A five-role, file-contract 3D-modeling pipeline for Claude Code, plus deterministic Python tooling (preflight gate, contract automation, mesh I/O, CAD runner)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Idan" }]
keywords = ["3d-printing", "cad", "fdm", "claude-code", "agents", "trimesh"]

# Core runtime deps derived from actual imports across
# skills/3d-modeling/scripts/**/*.py. team_preflight.py, mesh_io.py, and the
# team_tools contract package (i.e. everything the test-suite exercises) need
# only these three.
dependencies = [
    "trimesh",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Heavy OCC/OCP stack used only by the CadQuery runner (run_cadquery_model.py)
# and the cadquery-patterns reference. Deliberately kept out of default CI.
cad = ["cadquery"]

# Offscreen rendering used by preview.py / render / overlay tooling.
render = ["pyrender", "PyOpenGL"]

# The shared visual-verification tools (overlay_photo.py, verify_visual.py)
# additionally need these on top of `render`.
visual = ["pyrender", "PyOpenGL", "scipy", "shapely"]

# Bambu / 3MF authoring + verification (make_bambu_3mf.py).
bambu = ["lxml"]

# Everything (convenience for a full local workstation).
all = ["cadquery", "pyrender", "PyOpenGL", "scipy", "shapely", "lxml"]

[project.urls]
Homepage = "https://github.com/Idan/3d-modeling-skill"
Changelog = "https://github.com/Idan/3d-modeling-skill/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# The Python tooling all lives under one scripts dir; treat that as the source
# root so the existing tests' bare imports (`import team_preflight`,
# `import mesh_io`) resolve without an install step.
# ---------------------------------------------------------------------------
[tool.setuptools]
# Not a pip-installable library in the conventional sense; the skill tree is the
# deliverable. Packaging metadata above exists for dependency resolution only.
py-modules = []

[tool.ruff]
target-version = "py311"
# The heavy visual tools carry an intentional sys.path bootstrap before their
# sibling imports; those lines are annotated with `# noqa: E402` inline.
extend-exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes F + pycodestyle E4/E7/E9). Line length
# (E501) is intentionally not enforced — the source scripts predate it.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# All three suites live under the scripts dir and import their modules by bare
# name; put that dir on sys.path so collection resolves without an install.
pythonpath = ["skills/3d-modeling/scripts"]
testpaths = ["skills/3d-modeling/scripts"]
python_files = ["test_*.py"]
