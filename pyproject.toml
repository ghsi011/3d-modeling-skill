[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-modeling-skill"
version = "0.1.0"
description = "A five-role, file-contract 3D-modeling pipeline with deterministic Python tooling (preflight gate, contract automation, mesh I/O, CAD runner) for verification-driven modeling workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Idan" }]
keywords = ["3d-modeling", "3d-printing", "cad", "fdm", "agents", "trimesh", "verification", "automation"]

# Core runtime deps derived from actual imports across
# skills/3d-modeling/scripts/**/*.py. team_preflight.py, mesh_io.py, and the
# team_tools contract package need only trimesh + numpy + pillow; designer_toolkit
# adds manifold3d as the boolean engine trimesh uses for its interference /
# insertion-sweep / coupon operations (a light pure wheel — no OCP).
dependencies = [
    "trimesh",
    "numpy",
    "pillow",
    "manifold3d",
]

[project.optional-dependencies]
# Heavy OCC/OCP stack used only by the CadQuery runner (run_cadquery_model.py)
# and the cadquery-patterns reference. Deliberately kept out of default CI.
cad = ["cadquery"]

# Heavy OCC/OCP stack used only by build123d adapters and build123d-patterns.
# Kept separate from `cad` so hosts can choose their Python CAD stack explicitly.
cad-build123d = ["build123d"]

# Mesh cross-sectioning. Every one of these is a trimesh soft dependency the
# section path reaches in turn: scipy (csgraph, walking the cut edges),
# networkx (vertex-graph traversal into closed paths), shapely (the rings
# themselves), rtree (the enclosure tree that decides which ring is a hole).
# Needed by designer_toolkit.metrics.datum_features and the datum blocks
# bundle.finalize derives from it. All light pure wheels — kept separate from
# `visual` so the datum path does not drag in pyrender/PyOpenGL and a GL context.
# `visual` below contains this same set; keep the two in lockstep.
section = ["scipy", "networkx", "shapely", "rtree"]

# Offscreen rendering used by preview.py / render / overlay tooling.
render = ["pyrender", "PyOpenGL"]

# The shared visual-verification tools (overlay_photo.py, verify_visual.py)
# additionally need the whole `section` stack on top of `render`: their
# `slice_union` goes through `Path2D.polygons_full`, the same trimesh
# cross-section path `datum_features` uses, so rtree and networkx are load-bearing
# here too. Keep this in lockstep with `section` above — a partial set does not
# fail, it makes every slice IoU / overlay metric silently empty.
visual = ["pyrender", "PyOpenGL", "scipy", "networkx", "shapely", "rtree"]

# Bambu / 3MF authoring + verification (make_bambu_3mf.py).
bambu = ["lxml"]

# Local MCP stdio server for deterministic team tooling (tools/mcp_server.py).
mcp = ["mcp>=1.27,<2"]

# Everything (convenience for a full local workstation).
all = ["cadquery", "build123d", "scipy", "networkx", "shapely", "rtree", "pyrender", "PyOpenGL", "lxml", "mcp>=1.27,<2"]

[project.urls]
Homepage = "https://github.com/ghsi011/3d-modeling-skill"
Changelog = "https://github.com/ghsi011/3d-modeling-skill/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# The Python tooling all lives under one scripts dir; treat that as the source
# root so the existing tests' bare imports (`import team_preflight`,
# `import mesh_io`) resolve without an install step.
# ---------------------------------------------------------------------------
[tool.setuptools]
# Not a pip-installable library in the conventional sense; the skill tree is the
# deliverable. Packaging metadata above exists for dependency resolution only.
py-modules = []

[tool.ruff]
target-version = "py311"
# The heavy visual tools carry an intentional sys.path bootstrap before their
# sibling imports; those lines are annotated with `# noqa: E402` inline.
extend-exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes F + pycodestyle E4/E7/E9). Line length
# (E501) is intentionally not enforced — the source scripts predate it.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# All three suites live under the scripts dir and import their modules by bare
# name; put that dir on sys.path so collection resolves without an install.
pythonpath = [".", "skills/3d-modeling/scripts"]
testpaths = ["skills/3d-modeling/scripts", "tools"]
python_files = ["test_*.py"]
