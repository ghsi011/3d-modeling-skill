[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-modeling-skill"
version = "0.1.0"
description = "A five-role, file-contract 3D-modeling pipeline with deterministic Python tooling (preflight gate, contract automation, mesh I/O, CAD runner) for verification-driven modeling workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Idan" }]
keywords = ["3d-modeling", "3d-printing", "cad", "fdm", "agents", "trimesh", "verification", "automation"]

# Core runtime deps derived from actual imports across
# skills/3d-modeling/scripts/**/*.py. team_preflight.py, mesh_io.py, and the
# team_tools contract package need only trimesh + numpy + pillow; designer_toolkit
# adds manifold3d as the boolean engine trimesh uses for its interference /
# insertion-sweep / coupon operations (a light pure wheel — no OCP).
dependencies = [
    "trimesh",
    "numpy",
    "pillow",
    "manifold3d",
]

# What each extra is FOR is tabled in README.md#dependencies; the comments here
# only carry what the table cannot -- why a set is shaped the way it is.
[project.optional-dependencies]
# Two separate heavy OCC/OCP stacks so a host picks its Python CAD kernel
# explicitly rather than getting both.
cad = ["cadquery"]
cad-build123d = ["build123d"]

# Mesh cross-sectioning. Not a grab bag: these are the trimesh soft
# dependencies the section path reaches in turn -- scipy (csgraph, walking the
# cut edges), networkx (vertex graph -> closed paths), shapely (the rings),
# rtree (the enclosure tree deciding which ring is a hole). Kept out of
# `visual` so the datum path needs no pyrender/PyOpenGL or GL context.
section = ["scipy", "networkx", "shapely", "rtree"]

render = ["pyrender", "PyOpenGL"]

# `render` plus the whole `section` stack: verify_visual's slice_union goes
# through the same `Path2D.polygons_full` path datum_features uses. Keep in
# lockstep with `section` -- a partial set does not fail, it makes every slice
# IoU / overlay metric silently empty.
visual = ["pyrender", "PyOpenGL", "scipy", "networkx", "shapely", "rtree"]

bambu = ["lxml"]

# Everything (convenience for a full local workstation).
all = ["cadquery", "build123d", "scipy", "networkx", "shapely", "rtree", "pyrender", "PyOpenGL", "lxml"]

[project.urls]
Homepage = "https://github.com/ghsi011/3d-modeling-skill"
Changelog = "https://github.com/ghsi011/3d-modeling-skill/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# The Python tooling all lives under one scripts dir; treat that as the source
# root so the existing tests' bare imports (`import team_preflight`,
# `import mesh_io`) resolve without an install step.
# ---------------------------------------------------------------------------
[tool.setuptools]
# Not a pip-installable library in the conventional sense; the skill tree is the
# deliverable. Packaging metadata above exists for dependency resolution only.
py-modules = []

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set (pyflakes F + pycodestyle E4/E7/E9). Line length
# (E501) is intentionally not enforced — the source scripts predate it.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# All three suites live under the scripts dir and import their modules by bare
# name; put that dir on sys.path so collection resolves without an install.
pythonpath = [".", "skills/3d-modeling/scripts"]
testpaths = ["skills/3d-modeling/scripts", "tools"]
python_files = ["test_*.py"]
