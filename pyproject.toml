[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-modeling-skill"
version = "0.1.0"
description = "A contract-first 3D-modelling pipeline: an immutable model contract, deterministic commissioning of the exported mesh, broad anomaly screening, and bounded review only where judgment is genuinely required."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Idan" }]
keywords = ["3d-modeling", "3d-printing", "cad", "fdm", "agents", "trimesh", "verification", "automation"]

# The certified DIRECT path includes trimesh's complete cross-section stack:
# scipy, networkx, shapely and rtree. A wheel must be able to commission a
# normal certified job without selecting an extra; numpy/pillow are also core
# because trimesh and the witness path need them.
#
# build123d is core rather than an extra because a certified template may choose
# it and the runner must not have to ask whether it is installed. It is imported
# lazily -- a trimesh-only job never pays its ~1.5 s -- but it is always present.
#
# It is also the only STEP reader here, for `diagnose` and for the preservation
# audit alike. `trimesh.load` would dispatch STEP to `cascadio`; that package is
# deliberately absent. Measured on `vent_mount.step`, cascadio returns the part
# in metres where build123d returns millimetres, in 324 disconnected bodies
# against 10 -- so a second importer would buy a silent unit substitution of the
# kind ARCHITECTURE.md section 12 forbids, and no capability this one lacks.
#
# manifold3d is not an optimization. It is the only boolean engine this pipeline
# may use, selected explicitly at every call site; automatic engine selection is
# a commissioning failure.
dependencies = [
    "trimesh>=4.4",
    "numpy>=1.26",
    "pillow>=10",
    "manifold3d>=2.5",
    "build123d>=0.9",
    "scipy",
    "networkx",
    "shapely",
    "rtree",
]

# What each extra is FOR is tabled in README.md#dependencies; the comments here
# only carry what the table cannot -- why a set is shaped the way it is.
[dependency-groups]
# Dev-only, kept out of the core install: `uv sync --frozen --no-dev` gives a
# runtime-only toolchain; `uv sync --frozen --group dev` adds the test runner.
dev = ["pytest>=8", "ruff>=0.6"]

[project.optional-dependencies]
# Mesh cross-sectioning. The section extra is retained as a compatibility alias
# for existing install commands; its dependencies are core because certified DIRECT commissioning
# reaches this trimesh cross-section stack without selecting an extra.
section = ["scipy", "networkx", "shapely", "rtree"]

render = ["pyrender", "PyOpenGL"]

# `render` plus the whole `section` stack: verify_visual's slice_union goes
# through the same `Path2D.polygons_full` path datum_features uses. Keep in
# lockstep with `section` -- a partial set does not fail, it makes every slice
# IoU / overlay metric silently empty.
visual = ["pyrender", "PyOpenGL", "scipy", "networkx", "shapely", "rtree"]

bambu = ["lxml"]

# Everything (convenience for a full local workstation).
all = ["scipy", "networkx", "shapely", "rtree", "pyrender", "PyOpenGL", "lxml"]

# One fused production command. Lower-level verbs stay available for debugging
# but are never the production path -- a job is one invocation, because every
# extra one pays ~1.5 s of interpreter start to do work measured in milliseconds.
[project.scripts]
design-tool = "pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/ghsi011/3d-modeling-skill"
Changelog = "https://github.com/ghsi011/3d-modeling-skill/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# The Python tooling all lives under one scripts dir; treat that as the source
# root so the existing tests' bare imports (`import team_preflight`,
# `import mesh_io`) resolve without an install step.
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "skills/3d-modeling/scripts" }
py-modules = [
    "crop_evidence",
    "make_3mf",
    "make_bambu_3mf",
    "mesh_io",
    "overlay_photo",
    "preview",
    "team_preflight",
    "verify_visual",
]

[tool.setuptools.packages.find]
where = ["skills/3d-modeling/scripts"]
include = ["pipeline*", "designer_toolkit*", "team_tools*"]
# Runtime wheels contain the production Python surface needed by both
# `design-tool run-job` and the standalone tooling. The source checkout keeps
# tests beside those modules for convenient collection; setup.py's build_py
# hook excludes the test modules from the wheel.

[tool.ruff]
target-version = "py311"
# One file, named exactly. `model.py` is the script the proof fixture was
# actually built by: an immutable historical design source whose worth is that it
# is byte-identical to what ran and to the copy in the owner's own project, so
# formatting or linting it would mean editing the one artifact whose only claim
# is that nobody has. Nothing imports it.
#
# The exclusion is a path and not the tree above it on purpose. `benchmarks/`
# also holds fixture manifests, loaders and metadata that are maintained files
# and want linting like anything else, and excluding their directory would hide
# real problems in them under a rule written for something else. This states the
# ownership boundary where it actually falls: this file is outside tooling
# control, and the rest of the evidence tree is not.
#
# The exclusion protects the file from tooling. `tools/test_fixtures.py` pins its
# SHA-256, which protects it from being edited by hand. Neither substitutes for
# the other: an excluded file can still be changed, and a hashed file can still
# be reformatted into a red suite.
#
# If more immutable Python artifacts arrive, they go under a dedicated documented
# subtree and that subtree is excluded then -- not by widening this line now.
extend-exclude = ["benchmarks/references/vent-ball-combine/evidence/model.py"]
# Ruff lints an excluded path anyway when that path is handed to it directly,
# which is precisely how a pre-commit hook or an editor's format-on-save invokes
# it -- so without this the exclusion holds for `ruff check .` and lets the one
# tool most likely to rewrite the file straight through. There is one entry above
# and it is the file that must not be rewritten, so enforce it unequivocally.
force-exclude = true

[tool.ruff.lint]
# Ruff's default rule set (pyflakes F + pycodestyle E4/E7/E9). Line length
# (E501) is intentionally not enforced — the source scripts predate it.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# All three suites live under the scripts dir and import their modules by bare
# name; put that dir on sys.path so collection resolves without an install.
pythonpath = [".", "skills/3d-modeling/scripts"]
testpaths = ["skills/3d-modeling/scripts", "tools"]
python_files = ["test_*.py"]
