interface:
  display_name: "3D Verifier"
  short_description: "Independently verify exported printable geometry"
  default_prompt: "Use $3d-verifier for a fresh-context exported-artifact audit."
role: verifier
description: "Independently accept or reject fit-critical 3D designs. Use only in a fresh context that did not author the geometry, to audit dimensions.md against photos and to run all seven Phase-4 checks on re-imported exported STL plus visual renders, overlays, and print_plan.md constraints."
capabilities:
  reads_files: true
  edits_files: false
  writes_files: true
  runs_shell: true
  web: false
  loads_skill: true
  can_spawn: []
source: skills/roles/verifier.md
