interface:
  display_name: "3D Orchestrator"
  short_description: "Route and govern team 3D jobs"
  default_prompt: "Use $3d-orchestrator to route and govern this 3D-printing job."
role: orchestrator
description: "Route and govern 3D-printable modeling jobs. Use for new modeling or print-prep requests to run the five-role file-contract pipeline, enforce phase gates, dispatch specialists, maintain job state, and deliver verified artifacts without authoring geometry."
capabilities:
  reads_files: true
  edits_files: true
  writes_files: true
  runs_shell: true
  web: false
  loads_skill: true
  can_spawn: ["metrologist", "designer", "verifier", "print-engineer"]
source: skills/roles/orchestrator.md
